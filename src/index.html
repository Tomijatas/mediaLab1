<!DOCTYPE html>
<html>
<head>
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
  <title>Lab 1. Introduction to HTML5 and HLS</title>
</head>
<body>

<h1>My first HLS player</h1>

<video
  id="video"
  class="video-js"
  controls
  width="720"
  height="400"
>
  <source src="https://d2zihajmogu5jn.cloudfront.net/bipbop-advanced/bipbop_16x9_variant.m3u8" 
          type="application/x-mpegURL"> <!--nepavyko pirma nuoroda, teko naudoti antrąją-->
</video>

<br><br>

<button onclick="playVideo()">Play</button>
<button onclick="pauseVideo()">Pause</button>
<button onclick="stopVideo()">Stop</button>
<button onclick="forward()">+5s</button>
<button onclick="backward()">-5s</button>

<script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
<script src="js/control.js"></script>

</body>
</html>
